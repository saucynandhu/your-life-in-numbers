<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Life Stats</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>How long have you been alive?</h1>
    <div class="input-section">
      <p>Enter your Date of Birth</p>
      <input type="date" id="dob" />
      <button onclick="getStats()">Submit</button>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
      

    <div class="cards">
      <div class="card" id="output"></div>
      <div class="card" id="output1"></div>
      <div class="card" id="output25"></div>
      <div class="card" id="output3"></div>
      <div class="card" id="output4"></div>
      <div class="card" id="output2"></div>
      <div class="card" id="output5"></div>
      <div class="card" id="output6"></div>
      <div class="card" id="output7"></div>
    </div>

    <div class="dark-toggle">
      <label class="switch">
        <input type="checkbox" id="modeToggle">
        <span class="slider"></span>
      </label>
      <span>Dark Mode</span>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Toggle dark mode
    const toggle = document.getElementById('modeToggle');
    toggle.addEventListener('change', () => {
      document.body.classList.toggle('dark');
    });
  </script>
</body>
</html>
